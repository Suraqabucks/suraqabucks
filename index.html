<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suraka Bucks | Craft Brews & Coffee</title>
    <style>
        :root {
            --bg-color: #0d120f;
            --card-bg: #151d18;
            --accent-green: #00875a;
            --accent-gold: #d4af37;
            --text-light: #f1f5f3;
            --text-dim: #a0ac9e;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            border-bottom: 1px solid #1f2b24;
        }

        .logo-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0;
            color: var(--text-light);
        }

        .logo-sub {
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--accent-gold);
            margin-top: 4px;
            text-transform: uppercase;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
        }

        .hero-card {
            background: var(--card-bg);
            border: 1px solid #233229;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }

        .hero-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .hero-content {
            padding: 20px;
        }

        .badge {
            display: inline-block;
            background: rgba(0, 135, 90, 0.25);
            color: #25e2a0;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .item-title {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 8px 0;
        }

        .item-desc {
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .price-tag {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent-gold);
            margin-bottom: 20px;
        }

        .btn-whatsapp {
            display: block;
            width: 100%;
            background: var(--accent-green);
            color: white;
            text-align: center;
            padding: 16px 0;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(0, 135, 90, 0.4);
            box-sizing: border-box;
        }

        footer {
            margin-top: auto;
            padding: 25px 20px;
            color: var(--text-dim);
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="logo-title">SURAKA BUCKS</h1>
        <div class="logo-sub">Craft Brews & Coffee</div>
    </header>

    <div class="container">
        <div class="hero-card">
            <!-- Correct image filename from GitHub -->
            <img src="1791287688393.jpg" alt="Suraka Signature Iced Coffee" class="hero-img">
            
            <div class="hero-content">
                <span class="badge">SIGNATURE HERO PRODUCT</span>
                <h2 class="item-title">Suraka Signature Iced Coffee</h2>
                <p class="item-desc">Rich espresso blend with chilled milk and smooth caramel vanilla layers. Freshly brewed for Karachi's active creators.</p>
                <div class="price-tag">PKR 399</div>
                
                <!-- Direct WhatsApp Order Link with Pre-filled Details -->
                <a href="https://wa.me/923231224080?text=Hi%20Suraka%20Bucks!%20I%20want%20to%20order%20Signature%20Iced%20Coffee%20(PKR%20399).%0A%0AMy%20Details:%0AName:%20%0AAddress:%20%0APhone:%20" class="btn-whatsapp" target="_blank">
                    ORDER NOW VIA WHATSAPP
                </a>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Suraka Bucks. Karachi, Pakistan.
    </footer>

</body>
</html>
